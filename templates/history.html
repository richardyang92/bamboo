<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>历史图表 - AI 智能绘图工作流</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* Material Design Colors */
            --md-primary: #6200EE;
            --md-primary-variant: #3700B3;
            --md-secondary: #03DAC6;
            --md-background: #FFFFFF;
            --md-surface: #FFFFFF;
            --md-error: #B00020;
            --md-on-primary: #FFFFFF;
            --md-on-secondary: #000000;
            --md-on-background: #000000;
            --md-on-surface: #000000;
            --md-on-error: #FFFFFF;

            /* Elevation shadows - Material Design */
            --elevation-1: 0 1px 3px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.24);
            --elevation-2: 0 3px 6px rgba(0,0,0,0.16), 0 3px 6px rgba(0,0,0,0.23);
            --elevation-3: 0 10px 20px rgba(0,0,0,0.19), 0 6px 6px rgba(0,0,0,0.23);
            --elevation-4: 0 14px 28px rgba(0,0,0,0.25), 0 10px 10px rgba(0,0,0,0.22);
            --elevation-5: 0 19px 38px rgba(0,0,0,0.30), 0 15px 12px rgba(0,0,0,0.22);

            --md-success: #4CAF50;
            --md-warning: #FF9800;
            --md-info: #2196F3;
            --md-divider: rgba(0,0,0,0.12);
        }

        /* 深色主题 */
        [data-theme="dark"] {
            --bg-main: #121212;
            --bg-card: #1E1E1E;
            --bg-input: #2D2D2D;
            --text-primary: #FFFFFF;
            --text-secondary: #B0B0B0;
            --text-muted: #808080;
            --border: #333333;
            --border-light: #444444;
            --md-primary: #BB86FC;
            --md-primary-variant: #3700B3;
            --md-secondary: #03DAC6;
            --md-background: #121212;
            --md-surface: #1E1E1E;
            --md-on-primary: #000000;
            --md-on-background: #FFFFFF;
            --md-on-surface: #FFFFFF;
            --md-divider: rgba(255,255,255,0.12);
        }

        /* 亮色主题 */
        [data-theme="light"] {
            --bg-main: #FAFAFA;
            --bg-card: #FFFFFF;
            --bg-input: #F5F5F5;
            --text-primary: #212121;
            --text-secondary: #757575;
            --text-muted: #9E9E9E;
            --border: #E0E0E0;
            --border-light: #BDBDBD;
            --md-primary: #6200EE;
            --md-primary-variant: #3700B3;
            --md-secondary: #03DAC6;
            --md-background: #FAFAFA;
            --md-surface: #FFFFFF;
            --md-on-primary: #FFFFFF;
            --md-on-background: #212121;
            --md-on-surface: #212121;
            --md-divider: rgba(0,0,0,0.12);
        }

        body {
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* Material Design AppBar */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 64px;
            background: var(--md-surface);
            box-shadow: var(--elevation-4);
            z-index: 1000;
            display: flex;
            align-items: center;
            padding: 0 16px;
            transition: background 0.3s ease;
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .navbar-logo {
            width: 40px;
            height: 40px;
            background: var(--md-primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--elevation-2);
        }

        .navbar-logo .material-icons {
            color: var(--md-on-primary);
            font-size: 24px;
        }

        .navbar-title {
            font-size: 20px;
            font-weight: 500;
            color: var(--md-on-surface);
            letter-spacing: 0.15px;
        }

        .navbar-spacer {
            flex: 1;
        }

        .navbar-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        /* Material Design Button */
        .md-button {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 0 16px;
            height: 36px;
            border: none;
            border-radius: 4px;
            font-family: 'Roboto', sans-serif;
            font-size: 14px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1.25px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
        }

        .md-button-contained {
            background: var(--md-primary);
            color: var(--md-on-primary);
            box-shadow: var(--elevation-2);
        }

        .md-button-contained:hover {
            box-shadow: var(--elevation-4);
        }

        .md-button-contained:active {
            box-shadow: var(--elevation-1);
        }

        .md-button-outlined {
            background: transparent;
            color: var(--md-primary);
            border: 1px solid var(--md-primary);
        }

        .md-button-outlined:hover {
            background: rgba(98, 0, 238, 0.04);
        }

        .md-button-text {
            background: transparent;
            color: var(--md-primary);
        }

        .md-button-text:hover {
            background: rgba(98, 0, 238, 0.04);
        }

        .md-button .material-icons {
            font-size: 18px;
        }

        /* Material Design Icon Button */
        .md-icon-button {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
        }

        .md-icon-button:hover {
            background: rgba(0, 0, 0, 0.04);
            color: var(--text-primary);
        }

        [data-theme="dark"] .md-icon-button:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .md-icon-button .material-icons {
            font-size: 24px;
        }

        /* Legacy button compatibility */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1.25px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            font-family: 'Roboto', sans-serif;
        }

        .btn-primary {
            background: var(--md-primary);
            color: var(--md-on-primary);
            box-shadow: var(--elevation-2);
        }

        .btn-primary:hover {
            box-shadow: var(--elevation-4);
        }

        .btn-secondary {
            background: transparent;
            color: var(--md-primary);
            border: 1px solid var(--md-primary);
        }

        .btn-secondary:hover {
            background: rgba(98, 0, 238, 0.04);
        }

        .btn-danger {
            background: var(--md-error);
            color: var(--md-on-error);
        }

        .btn-danger:hover {
            background: var(--md-error);
            box-shadow: var(--elevation-2);
        }

        /* 主容器 */
        .main-container {
            margin-top: 64px;
            min-height: calc(100vh - 64px);
            padding: 40px;
        }

        .page-header {
            margin-bottom: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .page-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .page-subtitle {
            font-size: 15px;
            color: var(--text-secondary);
        }

        /* 加载状态 */
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 20px;
        }

        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid var(--bg-input);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 16px;
            color: var(--text-secondary);
        }

        /* 空状态 */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 20px;
            text-align: center;
        }

        .empty-icon {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-secondary);
        }

        .empty-text {
            font-size: 15px;
            color: var(--text-muted);
            margin-bottom: 24px;
            max-width: 400px;
        }

        /* 图片网格 */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
        }

        .gallery-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .gallery-item:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            border-color: var(--primary);
        }

        .gallery-image {
            width: 100%;
            height: 240px;
            object-fit: cover;
            background: var(--bg-input);
            transition: transform 0.3s ease;
        }

        .gallery-item:hover .gallery-image {
            transform: scale(1.02);
        }

        /* 文档卡片样式 */
        .gallery-item.document {
            border-color: var(--primary-light);
        }

        .document-preview {
            width: 100%;
            height: 240px;
            background: var(--primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 48px;
        }

        .gallery-info {
            padding: 16px;
        }

        .gallery-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
            word-break: break-all;
        }

        .gallery-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .gallery-actions {
            display: flex;
            gap: 8px;
        }

        .gallery-action-btn {
            flex: 1;
            padding: 8px 12px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .gallery-action-btn:hover {
            background: var(--bg-card);
            border-color: var(--primary);
            color: var(--primary);
        }

        .gallery-action-btn.delete:hover {
            background: rgba(239, 68, 68, 0.1);
            border-color: var(--error);
            color: var(--error);
        }

        /* 图片预览模态框 */
        .image-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 2000;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }

        .image-modal.show {
            display: flex;
        }

        .image-modal-backdrop {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
        }

        .image-modal-content {
            position: relative;
            max-width: 90vw;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            gap: 16px;
            animation: zoomIn 0.3s ease;
        }

        @keyframes zoomIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .image-modal-image-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .image-modal-content img {
            max-width: 100%;
            max-height: 80vh;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .image-modal-close {
            position: absolute;
            top: -50px;
            right: 0;
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            color: white;
            transition: all 0.2s ease;
        }

        .image-modal-close:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .image-modal-info {
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(10px);
            padding: 16px 20px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            color: white;
        }

        .image-modal-filename {
            font-size: 14px;
            font-weight: 600;
        }

        .image-modal-actions {
            display: flex;
            gap: 8px;
        }

        .image-modal-btn {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            color: white;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .image-modal-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .image-modal-btn.delete {
            background: rgba(239, 68, 68, 0.2);
            border-color: rgba(239, 68, 68, 0.3);
        }

        .image-modal-btn.delete:hover {
            background: rgba(239, 68, 68, 0.3);
        }

        /* 统计卡片 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            background: var(--primary);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
        }

        .stat-content {
            flex: 1;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .navbar {
                padding: 0 16px;
            }

            .navbar-title {
                display: none;
            }

            .main-container {
                padding: 20px;
            }

            .gallery-grid {
                grid-template-columns: 1fr;
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- 顶部导航栏 - Material Design -->
    <nav class="navbar">
        <div class="navbar-brand" onclick="goToHome()">
            <div class="navbar-logo">
                <span class="material-icons">palette</span>
            </div>
            <div class="navbar-title">Bamboo AI</div>
        </div>
        <div class="navbar-spacer"></div>
        <div class="navbar-actions">
            <!-- 返回首页 -->
            <button class="md-button md-button-outlined" onclick="goToHome()">
                <span class="material-icons">rocket_launch</span>
                <span>生成图表</span>
            </button>

            <!-- 主题切换 - Material Design Icon Button -->
            <button class="md-icon-button" onclick="toggleTheme()" title="切换主题">
                <span class="material-icons" id="themeIcon">dark_mode</span>
            </button>
        </div>
    </nav>

    <!-- 主容器 -->
    <div class="main-container">
        <!-- 页面标题 -->
        <div class="page-header">
            <div>
                <h1 class="page-title">历史图表</h1>
                <p class="page-subtitle">查看和管理所有生成的图表</p>
            </div>
            <button class="md-button md-button-contained" onclick="loadImages()">
                <span class="material-icons">refresh</span>
                <span>刷新</span>
            </button>
        </div>

        <!-- 统计卡片 -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon"><span class="material-icons">bar_chart</span></div>
                <div class="stat-content">
                    <div class="stat-value" id="totalCount">0</div>
                    <div class="stat-label">总图表数</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><span class="material-icons">storage</span></div>
                <div class="stat-content">
                    <div class="stat-value" id="totalSize">0 KB</div>
                    <div class="stat-label">总大小</div>
                </div>
            </div>
        </div>

        <!-- 加载状态 -->
        <div class="loading-container" id="loadingState">
            <div class="loading-spinner"></div>
            <div class="loading-text">加载历史图表中...</div>
        </div>

        <!-- 空状态 -->
        <div class="empty-state" id="emptyState" style="display: none;">
            <div class="empty-icon"><span class="material-icons">folder_open</span></div>
            <div class="empty-title">暂无历史图表</div>
            <div class="empty-text">还没有生成任何图表，快去创建第一个吧！</div>
            <button class="md-button md-button-contained" onclick="goToHome()">
                <span class="material-icons">rocket_launch</span>
                <span>开始生成</span>
            </button>
        </div>

        <!-- 图片网格 -->
        <div class="gallery-grid" id="galleryGrid"></div>
    </div>

    <!-- 图片预览模态框 -->
    <div class="image-modal" id="imageModal">
        <div class="image-modal-backdrop" onclick="closeImageModal()"></div>
        <div class="image-modal-content">
            <div class="image-modal-image-wrapper">
                <button class="image-modal-close" onclick="closeImageModal()"><span class="material-icons">close</span></button>
                <img id="imageModalPreview" src="" alt="图表预览">
            </div>
            <div class="image-modal-info">
                <div class="image-modal-filename" id="imageModalFilename">filename.png</div>
                <div class="image-modal-actions">
                    <button class="image-modal-btn" onclick="copyCurrentImage()">
                        <span class="material-icons">content_copy</span>
                        <span>复制</span>
                    </button>
                    <button class="image-modal-btn" onclick="downloadCurrentImage()">
                        <span class="material-icons">download</span>
                        <span>下载</span>
                    </button>
                    <button class="image-modal-btn delete" onclick="deleteCurrentImage()">
                        <span class="material-icons">delete</span>
                        <span>删除</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 文档预览模态框 -->
    <div class="image-modal" id="documentModal">
        <div class="image-modal-backdrop" onclick="closeDocumentModal()"></div>
        <div class="image-modal-content" style="max-width: 900px;">
            <div class="image-modal-image-wrapper">
                <button class="image-modal-close" onclick="closeDocumentModal()"><span class="material-icons">close</span></button>
                <iframe id="documentModalPreview" style="width: 100%; height: 70vh; border: none; border-radius: 12px;"></iframe>
            </div>
            <div class="image-modal-info">
                <div class="image-modal-filename" id="documentModalFilename">document.md</div>
                <div class="image-modal-actions">
                    <button class="image-modal-btn" onclick="downloadCurrentDocument()">
                        <span class="material-icons">download</span>
                        <span>下载</span>
                    </button>
                    <button class="image-modal-btn delete" onclick="deleteCurrentDocument()">
                        <span class="material-icons">delete</span>
                        <span>删除</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 主题管理
        const THEME_KEY = 'app-theme';
        const themes = ['light', 'dark', 'auto'];
        let currentThemeMode = localStorage.getItem(THEME_KEY) || 'auto';
        let currentImageData = null;
        let currentDocumentData = null;
        let allImages = [];

        // 初始化主题
        function initTheme() {
            applyTheme(currentThemeMode);
            updateThemeButton();
        }

        // 应用主题
        function applyTheme(mode) {
            const html = document.documentElement;
            const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';

            if (mode === 'auto') {
                html.setAttribute('data-theme', systemTheme);
            } else {
                html.setAttribute('data-theme', mode);
            }
        }

        // 更新主题按钮
        function updateThemeButton() {
            const icon = document.getElementById('themeIcon');

            const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            const actualTheme = currentThemeMode === 'auto' ? systemTheme : currentThemeMode;

            icon.textContent = actualTheme === 'dark' ? 'dark_mode' : 'light_mode';
        }

        // 切换主题
        function toggleTheme() {
            const currentIndex = themes.indexOf(currentThemeMode);
            const nextIndex = (currentIndex + 1) % themes.length;
            currentThemeMode = themes[nextIndex];

            localStorage.setItem(THEME_KEY, currentThemeMode);
            applyTheme(currentThemeMode);
            updateThemeButton();
        }

        // 监听系统主题变化
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
            if (currentThemeMode === 'auto') {
                applyTheme('auto');
                updateThemeButton();
            }
        });

        // 初始化
        initTheme();

        // 页面加载完成后获取图片列表
        document.addEventListener('DOMContentLoaded', () => {
            loadImages();
        });

        // 加载图片列表
        async function loadImages() {
            const loadingState = document.getElementById('loadingState');
            const emptyState = document.getElementById('emptyState');
            const galleryGrid = document.getElementById('galleryGrid');
            const totalCount = document.getElementById('totalCount');
            const totalSize = document.getElementById('totalSize');

            // 显示加载状态
            loadingState.style.display = 'flex';
            emptyState.style.display = 'none';
            galleryGrid.innerHTML = '';

            try {
                const response = await fetch('/api/history');
                const items = await response.json();
                allImages = items;

                // 隐藏加载状态
                loadingState.style.display = 'none';

                if (items.length === 0) {
                    emptyState.style.display = 'flex';
                    return;
                }

                // 更新统计信息
                const imageCount = items.filter(item => item.type === 'image').length;
                const documentCount = items.filter(item => item.type === 'document').length;
                totalCount.textContent = `${imageCount} 图表 / ${documentCount} 文档`;
                const totalBytes = items.reduce((sum, item) => sum + item.size, 0);
                totalSize.textContent = formatFileSize(totalBytes);

                // 渲染内容网格
                items.forEach((item, index) => {
                    const galleryItem = createGalleryItem(item, index);
                    galleryGrid.appendChild(galleryItem);
                });

            } catch (error) {
                console.error('加载历史记录失败:', error);
                loadingState.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon"><span class="material-icons">error</span></div>
                        <div class="empty-title">加载失败</div>
                        <div class="empty-text">无法加载历史图表，请稍后重试</div>
                        <button class="md-button md-button-contained" onclick="loadImages()">
                            <span class="material-icons">refresh</span>
                            <span>重试</span>
                        </button>
                    </div>
                `;
            }
        }

        // 创建图片卡片
        function createGalleryItem(item, index) {
            const div = document.createElement('div');
            div.className = 'gallery-item';

            // 根据类型添加class
            if (item.type === 'document') {
                div.classList.add('document');
            }

            div.onclick = (e) => {
                // 如果点击的是操作按钮，不打开预览
                if (e.target.closest('.gallery-action-btn')) return;

                // 根据类型打开不同的预览
                if (item.type === 'document') {
                    openDocumentModal(item);
                } else {
                    openImageModal(item);
                }
            };

            const date = new Date(item.created * 1000);
            const dateStr = date.toLocaleString('zh-CN');

            // 根据类型生成不同的预览内容
            let previewHTML = '';
            if (item.type === 'document') {
                previewHTML = `<div class="document-preview">📄</div>`;
            } else {
                previewHTML = `<img class="gallery-image" src="${item.url}?t=${Date.now()}" alt="${item.name}" loading="lazy">`;
            }

            // 根据类型生成不同的操作按钮
            let actionButtons = '';
            if (item.type === 'document') {
                actionButtons = `
                    <button class="gallery-action-btn" onclick="viewDocument(${index})">
                        <span class="material-icons">visibility</span>
                        <span>查看</span>
                    </button>
                    <button class="gallery-action-btn" onclick="downloadDocument('${item.url}', '${item.name}')">
                        <span class="material-icons">download</span>
                        <span>下载</span>
                    </button>
                    <button class="gallery-action-btn delete" onclick="deleteDocument('${item.name}', ${index})">
                        <span class="material-icons">delete</span>
                        <span>删除</span>
                    </button>
                `;
            } else {
                actionButtons = `
                    <button class="gallery-action-btn" onclick="viewImage(${index})">
                        <span class="material-icons">visibility</span>
                        <span>查看</span>
                    </button>
                    <button class="gallery-action-btn" onclick="copyImage('${item.url}', this)">
                        <span class="material-icons">content_copy</span>
                        <span>复制</span>
                    </button>
                    <button class="gallery-action-btn" onclick="downloadImage('${item.url}', '${item.name}')">
                        <span class="material-icons">download</span>
                        <span>下载</span>
                    </button>
                    <button class="gallery-action-btn delete" onclick="deleteImage('${item.name}', ${index})">
                        <span class="material-icons">delete</span>
                        <span>删除</span>
                    </button>
                `;
            }

            div.innerHTML = `
                ${previewHTML}
                <div class="gallery-info">
                    <div class="gallery-name">${item.name}</div>
                    <div class="gallery-meta">
                        <span><span class="material-icons" style="font-size:14px;vertical-align:middle;">event</span> ${dateStr}</span>
                        <span><span class="material-icons" style="font-size:14px;vertical-align:middle;">straighten</span> ${formatFileSize(item.size)}</span>
                    </div>
                    <div class="gallery-actions">
                        ${actionButtons}
                    </div>
                </div>
            `;

            return div;
        }

        // 打开图片预览
        function openImageModal(image) {
            currentImageData = image;
            const modal = document.getElementById('imageModal');
            const preview = document.getElementById('imageModalPreview');
            const filename = document.getElementById('imageModalFilename');

            preview.src = image.url + '?t=' + Date.now();
            filename.textContent = image.name;
            modal.classList.add('show');
        }

        // 关闭图片预览
        function closeImageModal() {
            const modal = document.getElementById('imageModal');
            modal.classList.remove('show');
            currentImageData = null;
        }

        // 查看图片
        function viewImage(index) {
            if (allImages[index]) {
                openImageModal(allImages[index]);
            }
        }

        // 下载图片
        function downloadImage(path, filename) {
            const link = document.createElement('a');
            link.href = path;
            link.download = filename;
            link.click();
        }

        // 下载当前预览的图片
        function downloadCurrentImage() {
            if (currentImageData) {
                downloadImage(currentImageData.url, currentImageData.name);
            }
        }

        // 删除图片
        async function deleteImage(filename, index) {
            if (!confirm(`确定要删除 "${filename}" 吗？`)) {
                return;
            }

            try {
                const response = await fetch(`/api/images/${filename}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    // 重新加载列表
                    loadImages();
                    // 关闭模态框（如果打开的话）
                    closeImageModal();
                } else {
                    alert('删除失败');
                }
            } catch (error) {
                console.error('删除图片失败:', error);
                alert('删除失败');
            }
        }

        // 删除当前预览的图片
        async function deleteCurrentImage() {
            if (currentImageData) {
                await deleteImage(currentImageData.name, -1);
            }
        }

        // 复制图片到剪贴板
        async function copyImage(imagePath, buttonElement) {
            try {
                // 获取图片
                const response = await fetch(imagePath + '?t=' + Date.now());
                const blob = await response.blob();

                // 复制到剪贴板
                await navigator.clipboard.write([
                    new ClipboardItem({
                        [blob.type]: blob
                    })
                ]);

                // 显示成功提示
                const originalText = buttonElement.innerHTML;
                buttonElement.innerHTML = '<span class="material-icons">check</span><span>已复制</span>';
                setTimeout(() => {
                    buttonElement.innerHTML = originalText;
                }, 2000);

            } catch (error) {
                console.error('复制失败:', error);
                alert('复制失败，请检查浏览器权限');
            }
        }

        // 复制当前预览的图片
        async function copyCurrentImage() {
            if (currentImageData) {
                try {
                    // 获取图片
                    const response = await fetch(currentImageData.path + '?t=' + Date.now());
                    const blob = await response.blob();

                    // 复制到剪贴板
                    await navigator.clipboard.write([
                        new ClipboardItem({
                            [blob.type]: blob
                        })
                    ]);

                    // 显示成功提示
                    alert('图片已复制到剪贴板！');

                } catch (error) {
                    console.error('复制失败:', error);
                    alert('复制失败，请检查浏览器权限');
                }
            }
        }

        // 格式化文件大小
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // 返回首页
        function goToHome() {
            window.location.href = '/';
        }

        // ESC键关闭模态框
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeImageModal();
                closeDocumentModal();
            }
        });

        // ========== 文档相关函数 ==========

        // 打开文档预览
        async function openDocumentModal(doc) {
            currentDocumentData = doc;
            const modal = document.getElementById('documentModal');
            const preview = document.getElementById('documentModalPreview');
            const filename = document.getElementById('documentModalFilename');

            try {
                const response = await fetch(doc.url);
                const content = await response.text();

                // 使用 marked.js 解析 Markdown，并添加数学公式支持
                const htmlContent = `
                    <!DOCTYPE html>
                    <html>
                    <head>
                        <meta charset="UTF-8">
                        <meta name="viewport" content="width=device-width, initial-scale=1.0">
                        <!-- Marked.js for Markdown -->
                        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"><\/script>
                        <!-- KaTeX for math rendering -->
                        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
                        <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"><\/script>
                        <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"><\/script>
                        <style>
                            body {
                                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
                                line-height: 1.6;
                                color: #333;
                                padding: 40px;
                                background: #fff;
                            }
                            h1, h2, h3, h4 {
                                border-bottom: 1px solid #eee;
                                padding-bottom: 0.3em;
                                margin-top: 1.5em;
                                margin-bottom: 0.5em;
                            }
                            h1 { font-size: 2em; }
                            h2 { font-size: 1.5em; }
                            h3 { font-size: 1.25em; }
                            code {
                                background: #f6f8fa;
                                padding: 0.2em 0.4em;
                                border-radius: 3px;
                                font-family: 'Monaco', 'Courier New', monospace;
                                font-size: 0.9em;
                            }
                            pre {
                                background: #f6f8fa;
                                padding: 16px;
                                border-radius: 6px;
                                overflow: auto;
                                border: 1px solid #e1e4e8;
                            }
                            pre code {
                                background: transparent;
                                padding: 0;
                                border: none;
                            }
                            blockquote {
                                border-left: 4px solid #dfe2e5;
                                padding-left: 16px;
                                color: #6a737d;
                                margin: 1em 0;
                            }
                            ul, ol {
                                padding-left: 2em;
                                margin: 1em 0;
                            }
                            li {
                                margin: 0.5em 0;
                            }
                            a {
                                color: #0366d6;
                                text-decoration: none;
                            }
                            a:hover {
                                text-decoration: underline;
                            }
                            p {
                                margin: 1em 0;
                            }
                            /* KaTeX 样式调整 */
                            .katex-display {
                                overflow-x: auto;
                                overflow-y: hidden;
                                padding: 0.5em 0;
                            }
                        </style>
                    </head>
                    <body>
                        <div id="content"></div>
                        <script>
                            const markdownContent = ${JSON.stringify(content)};

                            // 修复双反斜杠问题：将 LaTeX 中错误的双反斜杠替换为单反斜杠
                            function fixLatexBackslashes(text) {
                                // 保护真正的双反斜杠换行符
                                text = text.replace(/\\\\\\n/g, '___NEWLINE___');
                                // 将所有 \\+字母 替换为 \+字母
                                text = text.replace(/\\\\([a-zA-Z]+)/g, '\\$1');
                                // 恢复换行符
                                text = text.replace(/___NEWLINE___/g, '\\\\\\n');
                                return text;
                            }

                            const fixedContent = fixLatexBackslashes(markdownContent);

                            // 第一步：解析 Markdown
                            const content = document.getElementById('content');
                            content.innerHTML = marked.parse(fixedContent);

                            // 第二步：使用 KaTeX 自动渲染数学公式
                            renderMathInElement(content, {
                                delimiters: [
                                    {left: '$$', right: '$$', display: true},
                                    {left: '$', right: '$', display: false},
                                    {left: '\\[', right: '\\]', display: true},
                                    {left: '\\(', right: '\\)', display: false}
                                ],
                                throwOnError: false
                            });
                        <\/script>
                    </body>
                    </html>
                `;

                preview.srcdoc = htmlContent;
                filename.textContent = doc.name;
                modal.classList.add('show');
            } catch (error) {
                console.error('加载文档失败:', error);
                alert('加载文档失败');
            }
        }

        // 关闭文档预览
        function closeDocumentModal() {
            const modal = document.getElementById('documentModal');
            modal.classList.remove('show');
            currentDocumentData = null;
        }

        // 查看文档
        function viewDocument(index) {
            if (allImages[index]) {
                openDocumentModal(allImages[index]);
            }
        }

        // 下载文档
        function downloadDocument(url, filename) {
            const link = document.createElement('a');
            link.href = url;
            link.download = filename;
            link.click();
        }

        // 下载当前预览的文档
        function downloadCurrentDocument() {
            if (currentDocumentData) {
                downloadDocument(currentDocumentData.url, currentDocumentData.name);
            }
        }

        // 删除文档
        async function deleteDocument(filename, index) {
            if (!confirm(`确定要删除 "${filename}" 吗？`)) {
                return;
            }

            try {
                const response = await fetch(`/api/documents/${filename}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    loadImages();
                    closeDocumentModal();
                } else {
                    alert('删除失败');
                }
            } catch (error) {
                console.error('删除文档失败:', error);
                alert('删除失败');
            }
        }

        // 删除当前预览的文档
        async function deleteCurrentDocument() {
            if (currentDocumentData) {
                await deleteDocument(currentDocumentData.name, -1);
            }
        }
    </script>
</body>
</html>
