<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文档生成 - Bamboo AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cherry-markdown/dist/cherry-markdown.css">
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" id="MathJax-script" async></script>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/cherry-markdown/dist/cherry-markdown.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* Material Design Colors */
            --md-primary: #6200EE;
            --md-primary-variant: #3700B3;
            --md-secondary: #03DAC6;
            --md-background: #FFFFFF;
            --md-surface: #FFFFFF;
            --md-error: #B00020;
            --md-on-primary: #FFFFFF;
            --md-on-secondary: #000000;
            --md-on-background: #000000;
            --md-on-surface: #000000;
            --md-on-error: #FFFFFF;

            /* Elevation shadows - Material Design */
            --elevation-1: 0 1px 3px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.24);
            --elevation-2: 0 3px 6px rgba(0,0,0,0.16), 0 3px 6px rgba(0,0,0,0.23);
            --elevation-3: 0 10px 20px rgba(0,0,0,0.19), 0 6px 6px rgba(0,0,0,0.23);
            --elevation-4: 0 14px 28px rgba(0,0,0,0.25), 0 10px 10px rgba(0,0,0,0.22);
            --elevation-5: 0 19px 38px rgba(0,0,0,0.30), 0 15px 12px rgba(0,0,0,0.22);

            --md-success: #4CAF50;
            --md-warning: #FF9800;
            --md-info: #2196F3;
            --md-divider: rgba(0,0,0,0.12);
        }

        /* 深色主题 */
        [data-theme="dark"] {
            --bg-main: #121212;
            --bg-card: #1E1E1E;
            --bg-input: #2D2D2D;
            --text-primary: #FFFFFF;
            --text-secondary: #B0B0B0;
            --text-muted: #808080;
            --border: #333333;
            --border-light: #444444;
            --md-primary: #BB86FC;
            --md-primary-variant: #3700B3;
            --md-secondary: #03DAC6;
            --md-background: #121212;
            --md-surface: #1E1E1E;
            --md-on-primary: #000000;
            --md-on-background: #FFFFFF;
            --md-on-surface: #FFFFFF;
            --md-divider: rgba(255,255,255,0.12);
        }

        /* 亮色主题 */
        [data-theme="light"] {
            --bg-main: #FAFAFA;
            --bg-card: #FFFFFF;
            --bg-input: #F5F5F5;
            --text-primary: #212121;
            --text-secondary: #757575;
            --text-muted: #9E9E9E;
            --border: #E0E0E0;
            --border-light: #BDBDBD;
            --md-primary: #6200EE;
            --md-primary-variant: #3700B3;
            --md-secondary: #03DAC6;
            --md-background: #FAFAFA;
            --md-surface: #FFFFFF;
            --md-on-primary: #FFFFFF;
            --md-on-background: #212121;
            --md-on-surface: #212121;
            --md-divider: rgba(0,0,0,0.12);
        }

        body {
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* Material Design Button */
        .md-button {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 0 16px;
            height: 36px;
            border: none;
            border-radius: 4px;
            font-family: 'Roboto', sans-serif;
            font-size: 14px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1.25px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
        }

        .md-button-contained {
            background: var(--md-primary);
            color: var(--md-on-primary);
            box-shadow: var(--elevation-2);
        }

        .md-button-contained:hover {
            box-shadow: var(--elevation-4);
        }

        .md-button-contained:active {
            box-shadow: var(--elevation-1);
        }

        .md-button-text {
            background: transparent;
            color: var(--md-primary);
        }

        .md-button-text:hover {
            background: rgba(98, 0, 238, 0.04);
        }

        .md-button .material-icons {
            font-size: 18px;
        }

        /* Material Design Icon Button */
        .md-icon-button {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
        }

        .md-icon-button:hover {
            background: rgba(0, 0, 0, 0.04);
            color: var(--text-primary);
        }

        [data-theme="dark"] .md-icon-button:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .md-icon-button .material-icons {
            font-size: 24px;
        }

        /* 顶部导航栏 - Material Design AppBar */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 64px;
            background: var(--md-surface);
            box-shadow: var(--elevation-4);
            z-index: 1000;
            display: flex;
            align-items: center;
            padding: 0 16px;
            transition: background 0.3s ease;
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .navbar-logo {
            width: 40px;
            height: 40px;
            background: var(--md-primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--elevation-2);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .navbar-logo:hover {
            transform: scale(1.1);
            filter: brightness(1.1);
            box-shadow: var(--elevation-4);
        }

        .navbar-logo:active {
            transform: scale(0.95);
            filter: brightness(0.95);
        }

        .navbar-logo .material-icons {
            color: var(--md-on-primary);
            font-size: 24px;
        }

        .navbar-title {
            font-size: 20px;
            font-weight: 500;
            color: var(--md-on-surface);
            letter-spacing: 0.15px;
        }

        .navbar-spacer {
            flex: 1;
        }

        .navbar-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        /* 主容器 */
        .main-container {
            margin-top: 64px;
            min-height: calc(100vh - 64px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            max-width: 500px;
        }

        .empty-icon {
            font-size: 64px;
            color: var(--text-muted);
            margin-bottom: 24px;
            opacity: 0.5;
        }

        .empty-title {
            font-size: 32px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 12px;
        }

        .empty-text {
            font-size: 16px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 32px;
        }

        /* ==================== 侧滑栏样式 ==================== */

        /* 侧滑栏遮罩层 */
        .sidebar-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            z-index: 1001;
            backdrop-filter: blur(2px);
        }

        .sidebar-backdrop.show {
            opacity: 1;
            visibility: visible;
        }

        /* 侧滑栏容器 */
        .sidebar-drawer {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: 280px;
            background: var(--md-surface);
            box-shadow: var(--elevation-8);
            transform: translateX(-100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1002;
            display: flex;
            flex-direction: column;
        }

        .sidebar-drawer.open {
            transform: translateX(0);
        }

        /* 侧滑栏头部 */
        .sidebar-header {
            height: 64px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            border-bottom: 1px solid var(--md-divider);
            background: var(--md-primary);
        }

        .sidebar-title {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--md-on-primary);
            font-size: 18px;
            font-weight: 500;
        }

        .sidebar-title .material-icons {
            font-size: 24px;
        }

        /* 侧滑栏导航 */
        .sidebar-nav {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }

        .sidebar-nav-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 24px;
            color: var(--text-primary);
            text-decoration: none;
            transition: all 0.2s ease;
            border-left: 3px solid transparent;
            font-family: 'Roboto', sans-serif;
            font-size: 15px;
            cursor: pointer;
        }

        .sidebar-nav-item:hover {
            background: rgba(98, 0, 238, 0.08);
            border-left-color: var(--md-primary-variant);
        }

        .sidebar-nav-item.active {
            background: rgba(98, 0, 238, 0.12);
            border-left-color: var(--md-primary);
            color: var(--md-primary);
            font-weight: 500;
        }

        .sidebar-nav-item .material-icons {
            font-size: 24px;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 侧滑栏滚动条 */
        .sidebar-nav::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar-nav::-webkit-scrollbar-track {
            background: transparent;
        }

        .sidebar-nav::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        .sidebar-nav::-webkit-scrollbar-thumb:hover {
            background: var(--border-light);
        }

        /* 侧滑栏响应式 */
        @media (max-width: 768px) {
            .sidebar-drawer {
                width: 256px;
            }

            .sidebar-nav-item {
                padding: 16px 20px;
            }
        }

        /* ==================== Cherry Markdown Editor ==================== */
        .editor-container {
            width: 100%;
            height: calc(100vh - 64px);
            background: var(--bg-card);
            overflow: hidden;
        }

        .editor-container #editor {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Override Cherry Markdown styles for theme */
        [data-theme="dark"] .editor-container {
            background: #1E1E1E;
        }

        [data-theme="light"] .editor-container {
            background: #FFFFFF;
        }

        /* ==================== Input Dialog ==================== */
        .input-dialog-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 3000;
            backdrop-filter: blur(2px);
        }

        .input-dialog-overlay.show {
            display: flex;
        }

        .input-dialog {
            background: var(--md-surface);
            border-radius: 8px;
            box-shadow: var(--elevation-4);
            width: 90%;
            max-width: 500px;
            padding: 24px;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .dialog-title {
            font-size: 20px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 16px;
        }

        .dialog-textarea {
            width: 100%;
            min-height: 120px;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: var(--bg-input);
            color: var(--text-primary);
            font-family: 'Roboto', sans-serif;
            font-size: 14px;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .dialog-textarea:focus {
            border-color: var(--md-primary);
        }

        .dialog-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 16px;
        }

        /* ==================== Snackbar ==================== */
        .snackbar {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--md-on-surface);
            color: var(--md-surface);
            border-radius: 4px;
            padding: 14px 24px;
            box-shadow: var(--elevation-6);
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 4000;
            transition: transform 0.3s ease;
            max-width: 90%;
        }

        .snackbar.show {
            transform: translateX(-50%) translateY(0);
        }

        .snackbar-message {
            flex: 1;
            font-size: 14px;
            font-family: 'Roboto', sans-serif;
        }

        .snackbar-action {
            background: transparent;
            border: none;
            color: var(--md-secondary);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            padding: 8px 16px;
            text-transform: uppercase;
            letter-spacing: 1.25px;
            font-family: 'Roboto', sans-serif;
        }

        .snackbar-action:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* ==================== Loading Indicator ==================== */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 3500;
            backdrop-filter: blur(2px);
        }

        .loading-overlay.show {
            display: flex;
        }

        .loading-content {
            background: var(--md-surface);
            border-radius: 8px;
            padding: 24px;
            box-shadow: var(--elevation-4);
            text-align: center;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--md-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            font-size: 14px;
            color: var(--text-secondary);
            font-family: 'Roboto', sans-serif;
        }
    </style>
</head>
<body>
    <!-- 侧滑栏遮罩层 -->
    <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div>

    <!-- 侧滑栏 -->
    <aside class="sidebar-drawer" id="sidebarDrawer">
        <div class="sidebar-header">
            <div class="sidebar-title">
                <span class="material-icons">menu_book</span>
                <span>功能菜单</span>
            </div>
        </div>

        <div class="sidebar-nav">
            <a href="/" class="sidebar-nav-item" onclick="navigateTo('/')">
                <span class="material-icons">palette</span>
                <span>智能绘图</span>
            </a>
            <a href="/document" class="sidebar-nav-item active" onclick="navigateTo('/document')">
                <span class="material-icons">edit_document</span>
                <span>文档生成</span>
            </a>
        </div>
    </aside>

    <!-- 顶部导航栏 - Material Design -->
    <nav class="navbar">
        <div class="navbar-brand" onclick="toggleSidebar()" style="cursor: pointer;">
            <div class="navbar-logo">
                <span class="material-icons">spa</span>
            </div>
            <div class="navbar-title">Bamboo AI</div>
        </div>
        <div class="navbar-spacer"></div>
        <div class="navbar-actions">
            <button class="md-icon-button" onclick="toggleTheme()" title="切换主题">
                <span class="material-icons" id="themeIcon">dark_mode</span>
            </button>
        </div>
    </nav>

    <!-- 主容器 - Cherry Markdown Editor -->
    <div class="editor-container">
        <div id="editor"></div>
        <div id="editor-fallback" style="display: none; padding: 40px; text-align: center;">
            <h2 style="color: var(--text-primary); margin-bottom: 16px;">编辑器加载失败</h2>
            <p style="color: var(--text-secondary); margin-bottom: 24px;">
                Cherry Markdown Editor 无法加载。请检查网络连接或刷新页面重试。
            </p>
            <button class="md-button md-button-contained" onclick="location.reload()">
                <span class="material-icons">refresh</span>
                <span>刷新页面</span>
            </button>
        </div>
    </div>

    <!-- Input Dialog -->
    <div class="input-dialog-overlay" id="inputDialogOverlay">
        <div class="input-dialog">
            <div class="dialog-title" id="dialogTitle">输入</div>
            <textarea class="dialog-textarea" id="dialogTextarea" placeholder="请输入..."></textarea>
            <div class="dialog-actions">
                <button class="md-button md-button-text" onclick="closeInputDialog()">取消</button>
                <button class="md-button md-button-contained" id="dialogConfirmBtn">确定</button>
            </div>
        </div>
    </div>

    <!-- Snackbar -->
    <div class="snackbar" id="snackbar">
        <span class="snackbar-message" id="snackbarMessage"></span>
        <button class="snackbar-action" onclick="closeSnackbar()">关闭</button>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <div class="loading-text" id="loadingText">正在处理...</div>
        </div>
    </div>

    <script>
        // ==================== Global Variables ====================
        let cherryObj = null;
        const socket = io();
        let currentAIAction = null;
        let resolveDialogPromise = null;

        // ==================== Cherry Markdown Initialization ====================

        function initCherryEditor() {
            try {
                // Check if Cherry is available
                const CherryLib = window.Cherry || Cherry;
                if (typeof CherryLib === 'undefined') {
                    console.error('[ERROR] Cherry library not loaded');
                    showEditorFallback();
                    return;
                }

                console.log('[INFO] Initializing Cherry Markdown Editor...');
                console.log('[DEBUG] Cherry available:', typeof CherryLib);

                // Define custom AI assistant toolbar buttons
                const aiAssistantMenu = CherryLib.createMenuHook('AI助手', {
                    icon: {
                        type: 'svg',
                        content: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>',
                        iconStyle: 'width: 16px; height: 16px; vertical-align: middle;'
                    },
                    subMenuConfig: [
                        {
                            noIcon: true,
                            name: 'AI写文章',
                            onclick: () => { handleAIWriteArticle(); }
                        },
                        {
                            noIcon: true,
                            name: 'AI修改选中内容',
                            onclick: () => { handleAIModifySelection(); }
                        },
                        {
                            noIcon: true,
                            name: 'AI生成图片',
                            onclick: () => { handleAIGenerateImage(); }
                        }
                    ]
                });

                cherryObj = new CherryLib({
                    id: 'editor',
                    value: '',
                    locale: 'zh_CN',
                    theme: currentThemeMode === 'dark' ? 'dark' : 'light',
                    externals: {
                        mathjax: window.MathJax,
                    },
                    editor: {
                        defaultModel: 'edit&preview',
                        height: '100%',
                    },
                    toolbars: {
                        toolbar: [
                            'bold',
                            'italic',
                            'header',
                            'list',
                            'link',
                            '|',
                            'aiAssistantMenu'
                        ],
                        // Add AI assistant to float toolbar (appears at line start)
                        float: ['h1', 'h2', 'h3', '|', 'checklist', 'quote', 'table', 'code', '|', 'aiAssistantMenu'],
                        // Declare custom buttons
                        customMenu: {
                            aiAssistantMenu: aiAssistantMenu,
                        }
                    },
                    engine: {
                        global: {
                            formatMoney: false,
                        },
                        syntax: {
                            emoji: { enable: false },
                            fontEmphasis: { allowWhitespace: true },
                            footNote: { enable: true },
                            inlineCode: { enable: true },
                            mathBlock: {
                                engine: 'MathJax',
                                src: 'https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js',
                            },
                            inlineMath: {
                                engine: 'MathJax',
                            },
                            table: {
                                enableChart: false
                            },
                            image: {
                                lazyLoad: true
                            }
                        }
                    },
                    previewer: {
                        enablePreviewerBubble: false,
                    },
                    urlProcessor: function(url, srcType) {
                        if (srcType === 'image') {
                            if (!url.startsWith('http://') && !url.startsWith('https://') &&
                                !url.startsWith('/') && !url.startsWith('data:') &&
                                !url.startsWith('/api/images/')) {
                                return '/api/images/' + url;
                            }
                        }
                        return url;
                    },
                    callback: {
                        afterChange: function (markdown) {
                            // Editor content changed
                        }
                    }
                });
                console.log('[INFO] Cherry Markdown Editor initialized successfully');

            } catch (error) {
                console.error('[ERROR] Failed to initialize Cherry Markdown Editor:', error);
                showEditorFallback();
            }
        }

        function showEditorFallback() {
            const editor = document.getElementById('editor');
            const fallback = document.getElementById('editor-fallback');
            if (editor && fallback) {
                editor.style.display = 'none';
                fallback.style.display = 'block';
            }
        }

        // ==================== AI Action Handlers ====================
        // AI Write Article
        async function handleAIWriteArticle() {
            const topic = await showInputDialog('请输入文档主题', '例如：Python数据可视化教程');
            if (!topic) return;

            showLoading('正在生成文档...');

            try {
                const response = await fetch('/api/document/workflow-with-images', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({prompt: topic})
                });

                if (!response.ok) {
                    throw new Error('请求失败');
                }

                hideLoading();
                showSnackbar('文档生成已开始，请稍候...', 'info');
            } catch (error) {
                hideLoading();
                showSnackbar('文档生成失败: ' + error.message, 'error');
            }
        }

        // AI Modify Selection
        async function handleAIModifySelection() {
            const cm = cherryObj.getCodeMirror();
            const selectedText = cm.getSelection();

            if (!selectedText) {
                showSnackbar('请先选择要修改的内容', 'error');
                return;
            }

            const instructions = await showInputDialog('请输入修改指令', '例如：让它更简洁、更专业、添加示例等');
            if (!instructions) return;

            showLoading('正在修改内容...');

            try {
                const response = await fetch('/api/document/ai-modify', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        selected_text: selectedText,
                        instructions: instructions
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || '修改失败');
                }

                // Replace selected text with modified version
                cm.replaceSelection(data.modified_text);
                hideLoading();
                showSnackbar('内容修改成功', 'success');
            } catch (error) {
                hideLoading();
                showSnackbar('内容修改失败: ' + error.message, 'error');
            }
        }

        // AI Generate Image
        async function handleAIGenerateImage() {
            const description = await showInputDialog('请输入图片描述', '例如：展示2024年季度销售额的柱状图');
            if (!description) return;

            showLoading('正在生成图片...');

            try {
                const response = await fetch('/api/document/generate-image', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({description: description})
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || '图片生成失败');
                }

                // Insert image on new line
                const imageMarkdown = `\n<!-- IMAGE: ${description} -->\n![${description}](${data.image_url})\n`;
                cherryObj.insert(imageMarkdown);

                hideLoading();
                showSnackbar('图片生成成功', 'success');
            } catch (error) {
                hideLoading();
                showSnackbar('图片生成失败: ' + error.message, 'error');
            }
        }

        // ==================== SocketIO Event Listeners ====================
        socket.on('status_update', (data) => {
            if (data.type === 'document_with_images' && data.status === 'completed') {
                // Insert full document into editor
                const content = data.result.content;
                if (content) {
                    cherryObj.setMarkdown(content);
                    showSnackbar('文档生成完成', 'success');
                }
            } else if (data.type === 'document_with_images' && data.status === 'error') {
                hideLoading();
                showSnackbar('文档生成失败: ' + data.error, 'error');
            }
        });

        // ==================== Dialog Functions ====================
        function showInputDialog(title, placeholder) {
            return new Promise((resolve) => {
                const dialog = document.getElementById('inputDialogOverlay');
                const titleEl = document.getElementById('dialogTitle');
                const textarea = document.getElementById('dialogTextarea');
                const confirmBtn = document.getElementById('dialogConfirmBtn');

                titleEl.textContent = title;
                textarea.placeholder = placeholder;
                textarea.value = '';
                dialog.classList.add('show');
                textarea.focus();

                resolveDialogPromise = resolve;

                confirmBtn.onclick = () => {
                    const value = textarea.value.trim();
                    dialog.classList.remove('show');
                    resolve(value);
                };

                textarea.onkeydown = (e) => {
                    if (e.key === 'Enter' && e.ctrlKey) {
                        confirmBtn.click();
                    }
                };
            });
        }

        function closeInputDialog() {
            const dialog = document.getElementById('inputDialogOverlay');
            dialog.classList.remove('show');
            if (resolveDialogPromise) {
                resolveDialogPromise(null);
            }
        }

        // ==================== Snackbar Functions ====================
        function showSnackbar(message, type = 'info') {
            const snackbar = document.getElementById('snackbar');
            const messageEl = document.getElementById('snackbarMessage');

            messageEl.textContent = message;
            snackbar.classList.add('show');

            // Auto hide after 4 seconds
            setTimeout(() => {
                closeSnackbar();
            }, 4000);
        }

        function closeSnackbar() {
            const snackbar = document.getElementById('snackbar');
            snackbar.classList.remove('show');
        }

        // ==================== Loading Functions ====================
        function showLoading(text) {
            const overlay = document.getElementById('loadingOverlay');
            const textEl = document.getElementById('loadingText');
            textEl.textContent = text;
            overlay.classList.add('show');
        }

        function hideLoading() {
            const overlay = document.getElementById('loadingOverlay');
            overlay.classList.remove('show');
        }

        // ==================== Theme Management ====================
        const THEME_KEY = 'app-theme';
        const themes = ['light', 'dark', 'auto'];
        let currentThemeMode = localStorage.getItem(THEME_KEY) || 'auto';

        function initTheme() {
            applyTheme(currentThemeMode);
            updateThemeButton();
        }

        function applyTheme(mode) {
            const html = document.documentElement;
            const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';

            if (mode === 'auto') {
                html.setAttribute('data-theme', systemTheme);
            } else {
                html.setAttribute('data-theme', mode);
            }

            // Update Cherry Markdown editor theme (recreate instance)
            if (cherryObj && cherryObj.getValue) {
                const currentValue = cherryObj.getValue();
                const container = document.getElementById('editor');
                const parent = container.parentElement;

                // Destroy old instance
                parent.innerHTML = '<div id="editor"></div>';

                // Recreate with new theme
                const CherryLib = window.Cherry || Cherry;
                cherryObj = new CherryLib({
                    id: 'editor',
                    value: currentValue,
                    locale: 'zh_CN',
                    theme: mode === 'auto' ? systemTheme : mode,
                    externals: {
                        mathjax: window.MathJax,
                    },
                    editor: {
                        defaultModel: 'edit&preview',
                        height: '100%',
                    },
                    toolbars: {
                        toolbar: [
                            'bold',
                            'italic',
                            'header',
                            'list',
                            'link'
                        ]
                    },
                    engine: {
                        global: {
                            formatMoney: false,
                        },
                        syntax: {
                            emoji: { enable: false },
                            fontEmphasis: { allowWhitespace: true },
                            footNote: { enable: true },
                            inlineCode: { enable: true },
                            mathBlock: {
                                engine: 'MathJax',
                                src: 'https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js',
                            },
                            inlineMath: {
                                engine: 'MathJax',
                            },
                            table: {
                                enableChart: false
                            },
                            image: {
                                lazyLoad: true
                            }
                        }
                    },
                    previewer: {
                        enablePreviewerBubble: false,
                    },
                    urlProcessor: function(url, srcType) {
                        if (srcType === 'image') {
                            if (!url.startsWith('http://') && !url.startsWith('https://') &&
                                !url.startsWith('/') && !url.startsWith('data:') &&
                                !url.startsWith('/api/images/')) {
                                return '/api/images/' + url;
                            }
                        }
                        return url;
                    },
                    callback: {
                        afterChange: function (markdown) {}
                    }
                });
            }
        }

        function updateThemeButton() {
            const icon = document.getElementById('themeIcon');

            if (currentThemeMode === 'auto') {
                icon.textContent = 'brightness_auto';
            } else {
                icon.textContent = currentThemeMode === 'dark' ? 'dark_mode' : 'light_mode';
            }
        }

        function toggleTheme() {
            const currentIndex = themes.indexOf(currentThemeMode);
            const nextIndex = (currentIndex + 1) % themes.length;
            currentThemeMode = themes[nextIndex];

            localStorage.setItem(THEME_KEY, currentThemeMode);
            applyTheme(currentThemeMode);
            updateThemeButton();
        }

        // 监听系统主题变化
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
            if (currentThemeMode === 'auto') {
                applyTheme('auto');
                updateThemeButton();
            }
        });

        // 初始化
        initTheme();

        // ==================== 侧滑栏控制 ====================

        let isSidebarOpen = false;

        // 打开/关闭侧滑栏
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebarDrawer');
            const backdrop = document.getElementById('sidebarBackdrop');

            isSidebarOpen = !isSidebarOpen;

            if (isSidebarOpen) {
                sidebar.classList.add('open');
                backdrop.classList.add('show');
                document.body.style.overflow = 'hidden';
            } else {
                sidebar.classList.remove('open');
                backdrop.classList.remove('show');
                document.body.style.overflow = '';
            }
        }

        // 打开侧滑栏
        function openSidebar() {
            if (!isSidebarOpen) {
                toggleSidebar();
            }
        }

        // 关闭侧滑栏
        function closeSidebar() {
            if (isSidebarOpen) {
                toggleSidebar();
            }
        }

        // 导航到指定页面
        function navigateTo(path) {
            event.preventDefault();

            // 关闭侧滑栏
            closeSidebar();

            // 延迟跳转，等待动画完成
            setTimeout(() => {
                window.location.href = path;
            }, 300);
        }

        // ESC键关闭侧滑栏
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && isSidebarOpen) {
                closeSidebar();
            }
        });

        // 初始化：高亮当前页面
        function initSidebar() {
            const currentPath = window.location.pathname;
            const navItems = document.querySelectorAll('.sidebar-nav-item');

            navItems.forEach(item => {
                const href = item.getAttribute('href');
                if (href === currentPath) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', () => {
            console.log('[INFO] DOM loaded, initializing components...');

            try {
                initSidebar();
                console.log('[INFO] Sidebar initialized');
            } catch (error) {
                console.error('[ERROR] Failed to initialize sidebar:', error);
            }

            try {
                initCherryEditor();
                console.log('[INFO] Cherry editor initialized');
            } catch (error) {
                console.error('[ERROR] Failed to initialize Cherry editor:', error);
                showSnackbar('编辑器加载失败，请刷新页面重试', 'error');
            }
        });
    </script>
</body>
</html>
